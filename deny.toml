[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained notices count only for our direct dependencies; the ones in the
# tree today (bincode, paste, derivative, ansi_term, libsecp256k1) arrive through
# Solana crates. Vulnerabilities fail at any depth except the reviewed case below.
unmaintained = "workspace"
# LiteSVM -> solana-syscalls -> solana-secp256k1-recover -> k256 0.13 ->
# elliptic-curve 0.13 requires crypto-bigint 0.5; the fix is only in >=0.7.6.
# This path recovers public keys from public hashes/signatures, not secret
# integers. Revisit when Solana upgrades k256, or if we add secret-key use.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Solana's k256 dependency only performs public-key recovery on public inputs; no secret integers reach the affected operations." },
]

[licenses]
# ISC and CDLA-Permissive-2.0 arrive with TLS for the RPC client: ring, rustls-webpki
# and untrusted are ISC, the webpki-roots CA bundle is CDLA-Permissive-2.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
# Expected duplicates, all harmless: curve25519-dalek 4 (solana-zk-sdk) and 5
# (stealth-keygen), only bytes cross between them (docs/crypto.md);
# solana-address 1.x inside litesvm's loader; solana-zk-sdk 5.x inside
# litesvm's ZK ElGamal builtin next to our 7.0.1.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
