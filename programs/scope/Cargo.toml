[package]
name = "scope-program"
description = "Announces payer-built one-time confidential accounts and returns their rent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio.workspace = true
pinocchio-system.workspace = true
scope-interface.workspace = true
solana-address = { workspace = true, features = ["sha2"] }
solana-sha256-hasher.workspace = true

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { workspace = true, features = ["sha2", "curve25519"] }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }

[dev-dependencies]
curve25519-dalek.workspace = true
litesvm.workspace = true
scope-client = { workspace = true, features = ["litesvm"] }
solana-instruction.workspace = true
solana-instruction-error.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-system-interface.workspace = true
solana-transaction.workspace = true
solana-transaction-error.workspace = true
solana-zk-sdk.workspace = true
spl-token-2022-interface.workspace = true
spl-token-confidential-transfer-proof-extraction.workspace = true
spl-token-confidential-transfer-proof-generation.workspace = true
wincode.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
