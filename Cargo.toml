[workspace]
resolver = "3"
members = ["crates/*", "programs/*", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches rustc in Solana platform-tools v1.52, which builds the program.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scope-protocol/scope"
publish = false

[workspace.dependencies]
scope-client = { path = "crates/client" }
scope-interface = { path = "crates/interface" }
stealth-keygen = { path = "crates/stealth-keygen" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

pinocchio = { version = "0.11.2", default-features = false, features = ["cpi"] }
pinocchio-system = "0.6.1"
solana-sha256-hasher = "3.1.0"

# Off-chain Solana crates follow litesvm 0.16's line (solana-address 2.6). Move them
# together when litesvm moves to 2.7 (docs/verification.md, V29).
solana-address = "~2.6.1"
solana-commitment-config = "=3.1.1"
solana-instruction = "~3.4.1"
solana-instruction-error = "~2.4.0"
solana-keypair = "3.1.2"
solana-message = "~4.4.1"
solana-rpc-client = "=4.2.2"
solana-signer = "3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = "~4.1.6"
solana-transaction-error = "~3.3.1"
solana-transaction-status-client-types = "=4.2.2"
solana-zk-sdk = "=7.0.1"
spl-token-2022-interface = "=3.1.1"
spl-token-confidential-transfer-proof-extraction = "=0.6.1"
spl-token-confidential-transfer-proof-generation = "=0.6.1"
litesvm = "=0.16.0"
# Serializes v1 transactions (bincode cannot); the version solana-transaction 4.1 uses.
wincode = "0.5.5"
# Property tests only; the fork, timeout and regex features are not needed.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# Matches solana-zk-sdk's major; stealth-keygen is on 5.x.
curve25519-dalek = "4.1.3"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
# Lamport and balance arithmetic must fail loudly, on-chain and off.
overflow-checks = true
lto = "fat"
codegen-units = 1
